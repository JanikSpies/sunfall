# This builds the frontend and backend docker images
name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, bot]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  test-admin:
    runs-on: ubuntu-latest
    services:
      # Mirrors dev_postgres in docker-compose.dev.yml -- manage.py test needs
      # a real Postgres to create its throwaway test database against, even
      # with zero tests defined yet.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sunfall
          POSTGRES_PASSWORD: sunfall_test
          POSTGRES_DB: sunfall
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DJANGO_DEBUG unlocks the insecure fallback SECRET_KEY in settings.py --
      # fine here, this is a throwaway CI database, not a real deployment.
      DJANGO_DEBUG: "true"
      DATABASE_URL: "postgres://sunfall:sunfall_test@localhost:5432/sunfall"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: admin_panel
        run: |
          pip install pipenv
          pipenv install --system --deploy --ignore-pipfile
      - name: Run tests
        working-directory: admin_panel
        run: python manage.py test

  push:
    needs: [test-go, test-admin]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set ENV variables
        run: |
          echo "IMAGE_NAME_BACKEND=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}-backend" >> $GITHUB_ENV
          echo "IMAGE_NAME_FRONTEND=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}-frontend" >> $GITHUB_ENV
          echo "IMAGE_NAME_BOT=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}-bot" >> $GITHUB_ENV
          echo "IMAGE_NAME_ADMIN=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}-admin" >> $GITHUB_ENV

      - name: Create Dynamic .env File
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          bash .scripts/create_env.sh frontend

      - name: Build image backend
        run: |
          docker build ./backend --file ./backend/Dockerfile --tag $IMAGE_NAME_BACKEND --label "runnumber=${GITHUB_RUN_ID}"

      - name: Build image frontend
        run: |
          docker build ./frontend --file ./frontend/Dockerfile --tag $IMAGE_NAME_FRONTEND --label "runnumber=${GITHUB_RUN_ID}" --target production

      - name: Build image bot
        run: |
          docker build ./bot --file ./bot/Dockerfile --tag $IMAGE_NAME_BOT --label "runnumber=${GITHUB_RUN_ID}"

      - name: Build image admin panel
        run: |
          docker build ./admin_panel --file ./admin_panel/Dockerfile --tag $IMAGE_NAME_ADMIN --label "runnumber=${GITHUB_RUN_ID}" --target prod

      - name: Log in to registry
        if: ${{ github.event_name == 'push' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push images
        if: ${{ github.event_name == 'push' }}
        run: |
          IMAGE_ID_BACKEND=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME_BACKEND
          IMAGE_ID_BACKEND=$(echo $IMAGE_ID_BACKEND | tr '[A-Z]' '[a-z]')
          IMAGE_ID_FRONTEND=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME_FRONTEND
          IMAGE_ID_FRONTEND=$(echo $IMAGE_ID_FRONTEND | tr '[A-Z]' '[a-z]')
          IMAGE_ID_BOT=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME_BOT
          IMAGE_ID_BOT=$(echo $IMAGE_ID_BOT | tr '[A-Z]' '[a-z]')
          IMAGE_ID_ADMIN=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME_ADMIN
          IMAGE_ID_ADMIN=$(echo $IMAGE_ID_ADMIN | tr '[A-Z]' '[a-z]')
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          [ "$VERSION" == "main" ] && VERSION=latest
          echo IMAGE_ID_BACKEND=$IMAGE_ID_BACKEND
          echo IMAGE_ID_FRONTEND=$IMAGE_ID_FRONTEND
          echo IMAGE_ID_BOT=$IMAGE_ID_BOT
          echo IMAGE_ID_ADMIN=$IMAGE_ID_ADMIN
          echo VERSION=$VERSION
          docker tag $IMAGE_NAME_BACKEND $IMAGE_ID_BACKEND:$VERSION
          docker push $IMAGE_ID_BACKEND:$VERSION
          docker tag $IMAGE_NAME_FRONTEND $IMAGE_ID_FRONTEND:$VERSION
          docker push $IMAGE_ID_FRONTEND:$VERSION
          docker tag $IMAGE_NAME_BOT $IMAGE_ID_BOT:$VERSION
          docker push $IMAGE_ID_BOT:$VERSION
          docker tag $IMAGE_NAME_ADMIN $IMAGE_ID_ADMIN:$VERSION
          docker push $IMAGE_ID_ADMIN:$VERSION

      - name: Log out of registry
        run: docker logout ghcr.io