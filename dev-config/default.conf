server {
    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/x-javascript application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Brotli Settings
    brotli on;
    brotli_comp_level 4;
    brotli_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    listen 80;

    client_max_body_size 0;

    # Docker's embedded DNS. Needed so proxy_pass re-resolves each upstream's
    # hostname per request instead of caching whatever IP it had at nginx
    # startup -- without this, recreating any one service (a rebuild, a
    # `docker compose up` for just that container) leaves nginx pointing at
    # the old container's now-dead IP until nginx itself is restarted, which
    # shows up as a generic "nginx" 502 for that route only.
    resolver 127.0.0.11 valid=10s;

    location /ws {
        include /etc/nginx/proxy.conf;

        set $backend_upstream http://dev_backend:8080;
        proxy_pass $backend_upstream;
    }

    location /admin {
        include /etc/nginx/proxy.conf;

        set $admin_upstream http://dev_admin:8000;
        proxy_pass $admin_upstream;
    }

    location /graphs {
        include /etc/nginx/proxy.conf;

        set $grafana_upstream http://dev_grafana:3000;
        proxy_pass $grafana_upstream;
    }

    location / {
        include /etc/nginx/proxy.conf;

        set $frontend_upstream http://dev_frontend:3000;
        proxy_pass $frontend_upstream;
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
