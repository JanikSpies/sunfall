services:
  dev_backend:
    build:
      context: backend
      target: prod
    environment:
      WS_ALLOWED_ORIGINS: "localhost,localhost:3000,127.0.0.1,127.0.0.1:3000"
    ports:
      - "8080:8080"

  dev_frontend:
    build:
      context: frontend
      target: dev
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

  dev_proxy:
    image: macbre/nginx-brotli:1.19.6-http3@sha256:a2b9e34b969be3880ce33a02448e16b27a1e22282bfe0933b23cae465b2c2ea3
    ports:
      - "80:80"
    volumes:
      - ./dev-config/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dev-config/proxy.conf:/etc/nginx/proxy.conf:ro
    restart: unless-stopped

  dev_bot:
    profiles:
      - bots
    build:
      context: bot
      target: prod
    environment:
      # Talks to dev_backend directly over the compose network, not through
      # dev_proxy -- this is a backend load test, not a proxy/TLS test.
      BOT_URL: "ws://dev_backend:8080/ws"
      BOT_REACTION_MIN: 90ms
      BOT_REACTION_MAX: 320ms
      BOT_TARGET_COMMIT_MIN: 600ms
      BOT_TARGET_COMMIT_MAX: 2500ms
      BOT_MISTAKE_CHANCE: 0.035
      BOT_PANIC_DISTANCE: 180
      BOT_COMFORT_MARGIN: 240
      BOT_AGGRESSIVE_RATIO: 0.30
      BOT_CHASE_DISTANCE: 900
      BOT_DASH_CHANCE: 0.025
      BOT_IDLE_CHANCE: 0.08
      BOT_IDLE_MIN: 250ms
      BOT_IDLE_MAX: 1800ms
      BOT_DIRECTION_MIN: 700ms
      BOT_DIRECTION_MAX: 3500ms
      BOT_INPUT_JITTER: 0.15
      BOT_COUNT: 40
      BOT_SPAWN_RATE: 50
      BOT_DURATION: 20m
      BOT_INPUT_RATE: 20
