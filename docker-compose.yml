networks:
  project_network:
    driver: overlay

services:
  letsencrypt:
    image: linuxserver/swag:version-1.9.0@sha256:6a05c1b96d7a47f19c676ce84088b6aa90ac7d810f5b5dcb0ffa301931095604
    environment:
      - PUID=1000
      - PGID=8000
      - TZ=Europe/Zurich
      - URL=$LE_HOST # Change it to your host
      - STAGING=false # Set to true when testing/setup
      - SUBDOMAINS=
      - DHLEVEL=2048 # For quick testing. Better if 4096
      - VALIDATION=http
      - EXTRA_DOMAINS=$LE_EXTRA_HOSTS # ie. api.awesomeproject.janikspies.ch,test.awesomeproject.janikspies.ch
    volumes:
      - /data/le-config:/config
      - /data/test/static:/data/test/static:ro
      - /data/test/media:/data/test/media:ro
      - /data/prod/static:/data/prod/static:ro
      - /data/prod/media:/data/prod/media:ro
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    networks:
      project_network:
        aliases:
          - sunfall.io
          - www.sunfall.io
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      mode: global

  prod_backend: &prod_backend
    image: ${IMAGE_PATH_BACKEND}
    environment:
      WS_ALLOWED_ORIGINS: "https://sunfall.io,https://www.sunfall.io"
      DATABASE_URL: "postgres://${POSTGRES_USER:-sunfall}:${POSTGRES_PASSWORD}@prod_postgres:5432/${POSTGRES_DB:-sunfall}"
    build:
      context: backend
    env_file:
      - backend/.env
    networks:
      - project_network
    deploy:
      mode: replicated
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  prod_frontend:
    image: ${IMAGE_PATH_FRONTEND}
    build:
      context: frontend
      target: production
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    env_file:
      - frontend/.env
    ports:
      - "3000:3000"
    networks:
      - project_network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  prod_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sunfall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sunfall}
    volumes:
      - prod-postgres-data:/var/lib/postgresql/data
    networks:
      - project_network
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Django admin panel -- read-only view over the analytics tables the
  # backend's async writer fills in. Auth is Django's own login (no
  # anonymous access to anything under /admin/).
  prod_admin:
    image: ${IMAGE_PATH_ADMIN}
    build:
      context: admin_panel
      target: prod
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-sunfall}:${POSTGRES_PASSWORD}@prod_postgres:5432/${POSTGRES_DB:-sunfall}"
    env_file:
      - admin_panel/.env
    ports:
      - "8000:8000"
    # Django rejects underscores in the Host header (fails RFC 1034/1035
    # domain parsing before ALLOWED_HOSTS is even consulted), so
    # server-to-server callers (Grafana's token/userinfo calls below) need a
    # hyphenated name instead of the plain service name.
    networks:
      project_network:
        aliases:
          - admin-internal
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Dashboards over the same Postgres data. Datasource + dashboards are
  # provisioned as code (./grafana/provisioning), so a fresh deploy already
  # has them -- nothing to click through by hand. Login is Grafana's own
  # admin account; anonymous access and self-signup are both off.
  prod_grafana:
    image: grafana/grafana-oss:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_POSTGRES_HOST: "prod_postgres"
      GF_POSTGRES_PORT: "5432"
      GF_POSTGRES_DB: ${POSTGRES_DB:-sunfall}
      GF_POSTGRES_USER: ${POSTGRES_USER:-sunfall}
      GF_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # "Sign in with Django" -- off by default (GRAFANA_OAUTH_ENABLED unset)
      # until you've decided Grafana's real public URL; see README. TOKEN_URL
      # and API_URL are called server-to-server, so they use prod_admin's
      # hyphenated alias (admin-internal, see prod_admin above) rather than
      # the plain service name -- Django rejects Host headers with
      # underscores. AUTH_URL and ROOT_URL are browser-facing and must match
      # wherever Grafana actually ends up being reachable.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001/}
      # Required once Grafana sits behind nginx at /graphs (see prod nginx
      # config) instead of being hit directly on :3001 -- without this,
      # Grafana assumes it's served from "/" and its own asset links,
      # redirects and cookie paths break under the subpath. GRAFANA_ROOT_URL
      # must be set to the public subpath URL (e.g. https://sunfall.io/graphs/)
      # for this to actually work.
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: "Django"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "read"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OAUTH_AUTH_URL}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://admin-internal:8000/admin/o/token/"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://admin-internal:8000/admin/o/userinfo"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "login"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'admin') && 'Admin' || 'Viewer'"
    volumes:
      - prod-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - project_network
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  prod_bot:
    image: ${IMAGE_PATH_BOT}
    environment:
      # Talks to prod_backend directly over the internal overlay network -- not
      # through sunfall.io -- so this actually load-tests the game server instead
      # of the reverse proxy / DNS / whatever sits in front of the public domain.
      BOT_URL: "ws://prod_backend:8080/ws"
      BOT_REACTION_MIN: 90ms
      BOT_REACTION_MAX: 320ms
      BOT_TARGET_COMMIT_MIN: 600ms
      BOT_TARGET_COMMIT_MAX: 2500ms
      BOT_MISTAKE_CHANCE: 0.035
      BOT_PANIC_DISTANCE: 180
      BOT_COMFORT_MARGIN: 240
      BOT_AGGRESSIVE_RATIO: 0.30
      BOT_CHASE_DISTANCE: 900
      BOT_DASH_CHANCE: 0.025
      BOT_IDLE_CHANCE: 0.08
      BOT_IDLE_MIN: 250ms
      BOT_IDLE_MAX: 1800ms
      BOT_DIRECTION_MIN: 700ms
      BOT_DIRECTION_MAX: 3500ms
      BOT_INPUT_JITTER: 0.15
      BOT_COUNT: 10
      BOT_SPAWN_RATE: 50
      BOT_DURATION: 20m
      BOT_INPUT_RATE: 20
    build:
      context: bot
    networks:
      - project_network
    deploy:
      mode: replicated
      # Off by default -- this spins up a load test against the live server, not
      # something that should run on every deploy. Turn it on for a run with:
      #   docker service scale <stack>_prod_bot=1
      # or by exporting BOT_REPLICAS before deploying.
      replicas: ${BOT_REPLICAS:-0}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

volumes:
  prod-backend-shared:
  prod-postgres-data:
  prod-grafana-data: